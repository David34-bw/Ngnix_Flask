# Configuración del contenedor Nginx (se monta como /etc/nginx/conf.d/default.conf).
# Adaptada de laboratorio.conf (entrega 2): 127.0.0.1:500X -> nombres de servicio flaskX:5000.

# DNS interno de Docker. Se vuelve a consultar cada 5 s, así Nginx detecta cuando un
# contenedor desaparece o vuelve con otra IP, sin reiniciar Nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

# Registro que muestra a qué instancia se envió cada solicitud ($upstream_addr)
log_format balanceo '$remote_addr [$time_local] "$request" $status '
                    'upstream=$upstream_addr ($upstream_status) t=${request_time}s';

upstream servidores_flask {
    zone servidores_flask 64k;      # memoria compartida, requerida por "resolve"
    # Round robin (por defecto). Los tres usan el mismo puerto interno 5000:
    # cada contenedor tiene su propia IP en la red red_lab.
    server flask1:5000 resolve;
    server flask2:5000 resolve;
    server flask3:5000 resolve;
}

server {
    listen 80;                      # puerto interno; Compose lo publica como 8080
    access_log /var/log/nginx/access.log balanceo;   # en la imagen oficial va a stdout

    location / {
        proxy_pass http://servidores_flask;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Si una instancia no responde, se reintenta en la siguiente (comportamiento
        # pasivo: Nginx Open Source no hace comprobaciones activas de /health).
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;

        # Cabecera de diagnóstico: IP:puerto de la instancia que respondió
        add_header X-Upstream $upstream_addr always;
    }
}
